name: Build Base Image (CI:Build → ECR)

on:
  # Manual run (optional)
  workflow_dispatch: {}
  # Only react to PR merges; job itself will gate on the label
  pull_request:
    types: [closed]
    branches: [ master ]

permissions:
  contents: read
  pull-requests: read

jobs:
  build-base:
    # Gate: must be a merged PR AND must include CI:Build label
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      contains(join(github.event.pull_request.labels.*.name, ','), 'CI:Build')

    runs-on: ubuntu-latest

    # Make AWS creds & constants available to ALL steps
    env:
      # IAM user credentials (set these as repo Secrets)
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Region / account (use Variables or hardcode)
      AWS_REGION:            ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION:    ${{ vars.AWS_REGION }}

      # ECR registry + repo for BASE image
      ECR_REGISTRY:          ${{ vars.ECR_REGISTRY }}
      ECR_BASE_REPO:         ${{ vars.ECR_BASE_REPO }}
      IMAGE_URI:             ${{ vars.IMAGE_URI }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Build the merged code (base ref of the PR)
          ref: ${{ github.event.pull_request.base.ref || 'master' }}

      # (Optional) Sanity: confirm creds are usable
      - name: Who am I
        run: aws sts get-caller-identity

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Compute tag
        id: tag
        run: |
          SHA="${{ github.sha }}"
          echo "short=${SHA::6}" >> "$GITHUB_OUTPUT"
          echo "full_tag=$IMAGE_URI:base-${SHA::6}" >> "$GITHUB_OUTPUT"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build & push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/base/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.full_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
      
      - name: Image summary
        run: |
          echo "✅ Image built and pushed successfully!"
          echo ""
          echo "📦 Image: ${{ steps.tag.outputs.full_tag }}"
          echo ""
          echo "To use this image in devnet:"
          echo "  Update docker/devnet/Dockerfile:"
          echo "  ARG BASE_IMAGE=${{ steps.tag.outputs.full_tag }}"
          echo ""
          echo "Or set as environment variable:"
          echo "  export BASE_IMAGE=${{ steps.tag.outputs.full_tag }}"

      


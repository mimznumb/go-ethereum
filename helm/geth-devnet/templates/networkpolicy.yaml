{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "geth-devnet.fullname" . }}
  labels:
    {{- include "geth-devnet.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "geth-devnet.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from same namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: {{ .Release.Namespace }}
      ports:
        - protocol: TCP
          port: 8545  # HTTP RPC
        - protocol: TCP
          port: 8546  # WebSocket
    {{- if .Values.networkPolicy.allowExternal }}
    # Allow external traffic (e.g., from LoadBalancer)
    - from: []
      ports:
        - protocol: TCP
          port: 8545
        - protocol: TCP
          port: 8546
    {{- end }}
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    # Allow all egress for blockchain sync (if needed)
    {{- if .Values.networkPolicy.allowAllEgress }}
    - to: []
    {{- end }}
{{- end }}
